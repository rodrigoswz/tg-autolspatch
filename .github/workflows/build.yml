name: Clean repo and Patch TG

on:
  workflow_dispatch: {} # Enables the manual start
  schedule:
    - cron: '0 23 * * *' # Start every day at 23:00 UTC
  push: # Autorun after commits
    branches:
      - main

permissions:
  contents: write # Give permission to put the release into the repo
  actions: write # Give permission to delete workflow runs

jobs:
  ClearReleasesTagsWorkflowlogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Delete all releases
        run: |
          gh release list --limit 1000 | awk '{print $1}' | while read tag; do
            echo "Deleting release: $tag"
            gh release delete "$tag" -y || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete all tags
        run: |
          git fetch --tags
          git ls-remote --tags origin | awk '{print $2}' | sed 's|refs/tags/||' | while read tag; do
            echo "Deleting tag: $tag"
            git push origin --delete "$tag" || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0

  PatchTelegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create module list
        id: create_module_list
        run: |
          modules="-m Re-Telegram.apk -m SideStories.apk -m UserID.apk -m Nai.apk -m SpeedHook.apk -m TGnoBottomStuff.apk"
          echo "$modules" > module_list.txt
        shell: bash

      - name: Download Re-Telegram Module
        uses: robinraju/release-downloader@v1
        with:
          fileName: "app-release.apk"
          repository: hxreborn/Re-Telegram-CherryFork
          latest: true

      - name: Rename Re-Telegram Module
        run: mv app-release.apk Re-Telegram.apk
        shell: bash

      - name: Download UserID Viewer Module
        uses: robinraju/release-downloader@v1
        with:
          fileName: "com.alex193a.tguseridviewer_v*_*.apk"
          repository: Xposed-Modules-Repo/com.alex193a.tguseridviewer
          latest: true

      - name: Rename UserID Viewer Module
        run: mv com.alex193a.tguseridviewer_v*_*.apk UserID.apk
        shell: bash

      - name: Download Nai Module
        uses: robinraju/release-downloader@v1
        with:
          fileName: "app-release.apk"
          repository: Xposed-Modules-Repo/com.amanoteam.nai
          latest: true

      - name: Rename Nai Module
        run: mv app-release.apk Nai.apk
        shell: bash

      - name: Download SpeedHook Module
        uses: robinraju/release-downloader@v1
        with:
          fileName: "Telegram.Speed.Hook-*.apk"
          repository: araafroyall/Telegram-Speed-Hook
          latest: true

      - name: Rename SpeedHook Module
        run: mv Telegram.Speed.Hook-*.apk SpeedHook.apk
        shell: bash

      - name: Download LSPatch Jar from Github
        uses: robinraju/release-downloader@v1
        with:
          fileName: "lspatch-*-release.jar"
          repository: JingMatrix/LSPatch
          latest: true

      - name: Find all
        run: ls -l *.apk *.jar
        shell: bash

      - name: Download OctoGram Client
        run: |
          TAG=$(gh release list --repo OctoGramApp/OctoGram --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$TAG" --repo OctoGramApp/OctoGram --pattern "OctoGram_arm64.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Patch OctoGram Client
        run: |
          java -jar *.jar -l 2 OctoGram_arm64.apk $(cat module_list.txt)
        shell: bash

      - name: Rename OctoGram Patched APK
        run: |
          mv OctoGram_arm64-*.apk octogram-lsp.apk
        shell: bash

      - name: Create Release Info
        run: |
          curl -sSL https://dl.google.com/android/repository/build-tools_r33.0.2-linux.zip -o build-tools.zip
          unzip -q build-tools.zip -d build-tools
          AAPT=build-tools/android-13/aapt

          chmod +x "$AAPT"

          OCTO_INFO=$("$AAPT" dump badging octogram-lsp.apk | grep versionName)
          OCTO_VersionName=$(echo "$OCTO_INFO" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          OCTO_VersionCode=$(echo "$OCTO_INFO" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          OCTO_Version="$OCTO_VersionName ($OCTO_VersionCode)"

          echo "Used modules:" > release_body.txt
          echo "- Re-Telegram" >> release_body.txt
          echo "- SideStories" >> release_body.txt
          echo "- UserID Viewer" >> release_body.txt
          echo "- Nai" >> release_body.txt
          echo "- SpeedHook" >> release_body.txt
          echo "- TGnoBottomStuff" >> release_body.txt
          echo "" >> release_body.txt
          echo "Clients:" >> release_body.txt
          echo "- OctoGram - $OCTO_Version" >> release_body.txt
          echo "" >> release_body.txt
          echo "Patched at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release_body.txt
        shell: bash

      - name: Upload Release
        uses: softprops/action-gh-release@master
        with:
          files: |
            *-lsp.apk
          tag_name: LSpatched
          draft: false
          body_path: release_body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
